<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Two agents whose reward curves are indistinguishable, but whose behaviour differs: one plans a direct route, the other searches by wandering">
  <!-- left panel: the return curves agree -->
  <g stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5">
    <line x1="42" y1="238" x2="242" y2="238"/>
    <line x1="42" y1="86" x2="42" y2="238"/>
  </g>
  <path d="M44 234 C 84 224, 108 168, 140 138 C 172 110, 206 100, 240 96"
        fill="none" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M44 236 C 86 220, 106 176, 138 144 C 170 114, 208 104, 240 100"
        fill="none" stroke="#059669" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="9 7"/>
  <text x="42" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">return</text>
  <text x="142" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#64748b" text-anchor="middle">same reward curve</text>

  <!-- divider -->
  <line x1="286" y1="60" x2="286" y2="300" stroke="#94a3b8" stroke-opacity=".38" stroke-width="1" stroke-dasharray="4 6"/>
  <g stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 172 l22 0"/><path d="M274 165 l7 7 l-7 7"/>
  </g>

  <!-- right panel: the behaviour does not -->
  <g stroke="#94a3b8" stroke-opacity=".2" stroke-width="1">
    <line x1="330" y1="86" x2="330" y2="238"/><line x1="390" y1="86" x2="390" y2="238"/>
    <line x1="450" y1="86" x2="450" y2="238"/><line x1="510" y1="86" x2="510" y2="238"/>
    <line x1="330" y1="86" x2="510" y2="86"/><line x1="330" y1="162" x2="510" y2="162"/>
    <line x1="330" y1="238" x2="510" y2="238"/>
  </g>
  <path d="M342 226 L342 130 L420 130 L420 100 L498 100"
        fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M342 226 C 372 214, 348 186, 380 178 C 414 170, 386 146, 418 140 C 448 134, 436 116, 462 108 C 478 103, 490 101, 498 100"
        fill="none" stroke="#059669" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 7"/>
  <circle cx="342" cy="226" r="6" fill="#64748b"/>
  <circle cx="498" cy="100" r="6.5" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <text x="420" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#64748b" text-anchor="middle">different behaviour</text>

  <!-- key -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="42" y="46" fill="#2563eb">agent A · plans</text>
    <text x="330" y="46" fill="#059669">agent B · searches</text>
  </g>
</svg>
