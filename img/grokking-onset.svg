<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Grokking curves: training accuracy saturates early while test accuracy jumps much later, with a predicted onset marker before the jump">
  <g stroke="#64748b" stroke-opacity=".25" stroke-width="1">
    <line x1="70" y1="70" x2="520" y2="70"/>
    <line x1="70" y1="140" x2="520" y2="140"/>
    <line x1="70" y1="210" x2="520" y2="210"/>
  </g>
  <g stroke="#64748b" stroke-opacity=".6" stroke-width="1.5">
    <line x1="70" y1="284" x2="520" y2="284"/>
    <line x1="70" y1="48" x2="70" y2="284"/>
  </g>
  <path d="M72 282 C 98 234, 110 86, 142 58 L520 56" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 280 C 162 278, 252 274, 298 266 C 324 260, 340 116, 374 60 L520 56" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="318" y1="48" x2="318" y2="284" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="318" cy="48" r="5" fill="#64748b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="152" y="42" fill="#38bdf8" font-weight="600">train</text>
    <text x="406" y="42" fill="#10b981" font-weight="600">test</text>
    <text x="318" y="312" fill="#64748b" text-anchor="middle">predicted onset</text>
    <text x="70" y="312" fill="#64748b">epochs</text>
  </g>
</svg>
